[package]
name = "oxeylyzer"
version = "0.2.0"
authors = ["O_X_E_Y <lucoerlemans37@gmail.com>"]
edition = "2024"
rust-version.workspace = true

[workspace]
members = [
    "oxeylyzer-core",
    "oxeylyzer-repl",
    "oxeylyzer-resources",
    "oxeylyzer-bench",
    "oxeylyzer-tauri/src-tauri"
]

[workspace.package]
# MSRV mirror: the floor CI computes as the oldest of the three newest stable
# releases. scripts/ci/rust-window.sh prints the truth; this value must match it.
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0"
directories = "6"
indexmap = { version = "2.13" }
itertools = "0.15"
libdof = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.16"
thiserror = "2.0"
toml = "1"

[dependencies]
oxeylyzer-core = { path = "./oxeylyzer-core" }
oxeylyzer-repl = { path = "./oxeylyzer-repl" }

[dev-dependencies]
diol = { version = "0.13.1" }
oxeylyzer-resources = { path = "./oxeylyzer-resources" }

[profile.release]
lto = "fat"

[[bench]]
name = "generation"
harness = false

[[bin]]
name = "oxeylyzer"
path = "./oxeylyzer-repl/src/bin/main.rs"
