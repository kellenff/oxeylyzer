[package]
name = "oxeylyzer-core"
version = "0.2.0"
authors = ["o-x-e-y <lucoerlemans37@gmail.com>"]
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
description = "Core library for Oxeylyzer, a keyboard layout analyzer"
# Maintained fork is the home of this code; the original project is history.
# crates.io still serves upstream's 0.1.2 (owner: o-x-e-y); this workspace is 0.2.0
# and has not been published from the fork.
repository = "https://github.com/kellenff/oxeylyzer"
categories = ["algorithms", "data-structures", "mathematics"]
documentation = "https://docs.rs/oxeylyzer-core"

[dependencies]
itertools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
nanorand = "0.8"
rayon = "1.12"
file-chunker = "0.1.1"
anyhow = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
toml = { workspace = true }
ahash = { version = "0.8.11", features = ["serde"] }
libdof = { workspace = true }
sliding_window_alt = "0.1.2"
thiserror = { workspace = true }
serde_with = { workspace = true }
fxhash = "0.2"

[dev-dependencies]
time_this = "0"
approx = "0"
fancy-regex = "0.19"
